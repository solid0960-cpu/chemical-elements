<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Химиялык элементтердин 3D симуляциясы</title>
<style>
:root{--bg:#0e1a24;--panel:#16283a;--line:#2b435a;--text:#eaf2f8;--muted:#9db3c6;--accent:#4fd1a5}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.15rem}
button{font:inherit;color:var(--text);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent)}
.tabs button{background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:8px;margin-left:6px}
.tabs button.on{border-color:var(--accent);background:#1d4a44}
section{flex:1;min-height:0}
#sim{display:flex;flex-direction:column;overflow-y:auto}
.top{flex:none;height:max(460px,66vh);display:grid;grid-template-columns:1fr 330px}
.stage{position:relative;min-height:0}
#stage{width:100%;height:100%;display:block;cursor:grab}
.legend{position:absolute;left:10px;top:10px;background:rgba(22,40,58,.75);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.72rem;pointer-events:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.ctrl{position:absolute;left:10px;bottom:10px;background:rgba(22,40,58,.9);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.8rem}
.ctrl input{vertical-align:middle;width:110px}
#info{padding:14px;border-left:1px solid var(--line);background:var(--panel);overflow:auto}
.head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
#big{width:74px;height:74px;border-radius:10px;border:2px solid;display:grid;place-items:center;font-size:2rem;font-weight:bold}
#nm{font-size:1.4rem;font-weight:bold}
#info table{width:100%;border-collapse:collapse;font-size:.9rem}
#info td{padding:4px 0;border-bottom:1px solid var(--line)}
#info td:last-child{text-align:right;font-weight:bold}
#bio{color:var(--muted);font-size:.85rem;line-height:1.4;margin:10px 0}
.nav{display:flex;gap:6px}
.nav button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.nav button:hover{border-color:var(--accent)}
.tw{flex:none;overflow:auto;border-top:1px solid var(--line);padding:8px;background:var(--panel)}
#pt{display:grid;grid-template-columns:repeat(18,minmax(34px,1fr));grid-template-rows:repeat(7,auto) 8px repeat(2,auto);gap:3px;min-width:680px;max-width:1100px;margin:auto}
#pt button{background:var(--bg);border:1px solid;border-radius:5px;padding:2px 0;line-height:1.1}
#pt button small{display:block;font-size:.55rem;color:var(--muted)}
#pt button b{font-size:.85rem}
#pt button.on{background:#fff2;box-shadow:0 0 0 2px #fff}
#quiz{overflow:auto;padding:20px;display:flex;justify-content:center}
.qbox{max-width:620px;width:100%}
.qbox h2{font-size:1.25rem;margin:8px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;font-size:1rem}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.ok{background:#1d5a3f;border-color:#4fd1a5}
.opt.bad{background:#6a2a33;border-color:#ff6b6b}
.exp{background:var(--panel);border-left:4px solid var(--accent);padding:10px 12px;margin:12px 0;border-radius:6px;font-size:.9rem;line-height:1.4}
.btn{background:var(--accent);color:#06251d;border:0;border-radius:8px;padding:10px 18px;font-weight:bold}
.muted{color:var(--muted);font-size:.9rem}
@media(max-width:800px){body{height:auto;min-height:100vh}#sim{overflow:visible}.top{height:auto;grid-template-columns:1fr;grid-template-rows:55vh auto}#info{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Химиялык элементтердин 3D симуляциясы</h1>
  <div class="tabs"><button id="t1" class="on">Симуляция</button><button id="t2">Тест</button></div>
</header>

<section id="sim">
  <div class="top">
    <div class="stage">
      <canvas id="stage"></canvas>
      <div class="legend">
        <div><i style="background:#ff6b6b"></i>Протон (+)</div>
        <div><i style="background:#b8c4cf"></i>Нейтрон (0)</div>
        <div><i style="background:#5cc8ff"></i>Электрон (−)</div>
        <div><i style="background:#ffb84d"></i>Сырткы кабыктагы электрон</div>
      </div>
      <div class="ctrl"><label>Ылдамдык <input id="spd" type="range" min="0" max="3" step="0.1" value="1"></label></div>
    </div>
    <div id="info">
      <div class="head"><div id="big"></div><div id="nm"></div></div>
      <table>
        <tr><td>Атомдук номери</td><td id="z"></td></tr>
        <tr><td>Массалык саны</td><td id="a"></td></tr>
        <tr><td>Протон</td><td id="pr"></td></tr>
        <tr><td>Нейтрон</td><td id="ne"></td></tr>
        <tr><td>Электрон</td><td id="el"></td></tr>
        <tr><td>Электрон кабыктары</td><td id="sh"></td></tr>
        <tr><td>Сырткы кабыктагы электрон</td><td id="va"></td></tr>
        <tr><td>Тобу</td><td id="gr"></td></tr>
      </table>
      <p id="bio"></p>
      <div class="nav"><button id="pv">◀ Мурунку</button><button id="nx">Кийинки ▶</button><button id="rd">Кокус</button></div>
      <p class="muted">Чычкан менен буруңуз, дөңгөлөкчө менен жакындатыңыз. Клавиатурада ← → баскычтары да иштейт.</p>
    </div>
  </div>
  <div class="tw"><div id="pt"></div></div>
</section>

<section id="quiz" hidden><div class="qbox" id="qb"></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const RAW="H Суутек 1,He Гелий 4,Li Литий 7,Be Бериллий 9,B Бор 11,C Көмүртек 12,N Азот 14,O Кычкылтек 16,F Фтор 19,Ne Неон 20,Na Натрий 23,Mg Магний 24,Al Алюминий 27,Si Кремний 28,P Фосфор 31,S Күкүрт 32,Cl Хлор 35,Ar Аргон 40,K Калий 39,Ca Кальций 40,Sc Скандий 45,Ti Титан 48,V Ванадий 51,Cr Хром 52,Mn Марганец 55,Fe Темир 56,Co Кобальт 59,Ni Никель 59,Cu Жез 64,Zn Цинк 65,Ga Галлий 70,Ge Германий 73,As Мышьяк 75,Se Селен 79,Br Бром 80,Kr Криптон 84,Rb Рубидий 85,Sr Стронций 88,Y Иттрий 89,Zr Цирконий 91,Nb Ниобий 93,Mo Молибден 96,Tc Технеций 98,Ru Рутений 101,Rh Родий 103,Pd Палладий 106,Ag Күмүш 108,Cd Кадмий 112,In Индий 115,Sn Калай 119,Sb Сурьма 122,Te Теллур 128,I Йод 127,Xe Ксенон 131,Cs Цезий 133,Ba Барий 137,La Лантан 139,Ce Церий 140,Pr Празеодим 141,Nd Неодим 144,Pm Прометий 145,Sm Самарий 150,Eu Европий 152,Gd Гадолиний 157,Tb Тербий 159,Dy Диспрозий 163,Ho Гольмий 165,Er Эрбий 167,Tm Тулий 169,Yb Иттербий 173,Lu Лютеций 175,Hf Гафний 178,Ta Тантал 181,W Вольфрам 184,Re Рений 186,Os Осмий 190,Ir Иридий 192,Pt Платина 195,Au Алтын 197,Hg Сымап 201,Tl Таллий 204,Pb Коргошун 207,Bi Висмут 209,Po Полоний 209,At Астат 210,Rn Радон 222,Fr Франций 223,Ra Радий 226,Ac Актиний 227,Th Торий 232,Pa Протактиний 231,U Уран 238,Np Нептуний 237,Pu Плутоний 244,Am Америций 243,Cm Кюрий 247,Bk Берклий 247,Cf Калифорний 251,Es Эйнштейний 252,Fm Фермий 257,Md Менделевий 258,No Нобелий 259,Lr Лоуренсий 262,Rf Резерфордий 267,Db Дубний 268,Sg Сиборгий 271,Bh Борий 272,Hs Хассий 270,Mt Мейтнерий 276,Ds Дармштадтий 281,Rg Рентгений 280,Cn Коперниций 285,Nh Нихоний 284,Fl Флеровий 289,Mc Московий 288,Lv Ливерморий 293,Ts Теннессин 294,Og Оганесон 294";
const EL=RAW.split(",").map(s=>{const[a,b,c]=s.split(" ");return{s:a,n:b,m:+c}});
const CAT=[["Металл эместер","#4fd1a5"],["Асыл газдар","#b28dff"],["Щелочтуу металлдар","#ff8a65"],["Щелочтуу-жер металлдары","#ffc857"],["Жарым металлдар","#7fd6c2"],["Галогендер","#f78fb3"],["Өткөөл металлдар","#5cc8ff"],["Лантаноиддер","#8fa8ff"],["Актиноиддер","#c792ea"],["Башка металлдар","#9db3c6"]];
function cat(z){
  if([2,10,18,36,54,86,118].includes(z))return 1;
  if([3,11,19,37,55,87].includes(z))return 2;
  if([4,12,20,38,56,88].includes(z))return 3;
  if([5,14,32,33,51,52].includes(z))return 4;
  if([9,17,35,53,85,117].includes(z))return 5;
  if([1,6,7,8,15,16,34].includes(z))return 0;
  if(z>=57&&z<=71)return 7; if(z>=89&&z<=103)return 8;
  if((z>=21&&z<=30)||(z>=39&&z<=48)||(z>=72&&z<=80)||(z>=104&&z<=112))return 6;
  return 9;
}
const BIO={1:"Суунун жана органикалык заттардын курамында.",2:"Инерттүү газ, организмде роль ойнобойт.",5:"Өсүмдүктөрдүн өсүшү үчүн керек.",6:"Бардык органикалык заттардын негизи.",7:"Белоктордун жана ДНКнын курамында.",8:"Дем алуу үчүн зарыл, суунун курамында.",9:"Тиштин эмалын бекемдейт.",10:"Инерттүү газ, организмде роль ойнобойт.",11:"Нерв импульстарын жана суунун тең салмактуулугун жөнгө салат.",12:"Хлорофиллдин борборунда, фотосинтезге керек.",14:"Өсүмдүктөрдүн жана сөөктүн бекемдигине жардам берет.",15:"ДНК, РНК жана АТФтын курамында.",16:"Белоктордун (аминокислоталардын) курамында.",17:"Ашказан ширесинин курамында (HCl).",18:"Инерттүү газ, организмде роль ойнобойт.",19:"Клеткалардын жана нерв импульстарынын иштешинде.",20:"Сөөктөрдүн жана тиштердин негизги курамы.",26:"Гемоглобиндин курамында, кандагы кычкылтекти ташыйт.",27:"В12 витамининин курамында.",29:"Кээ бир ферменттердин курамында, аз өлчөмдө керек.",30:"Көптөгөн ферменттердин курамында, иммундук системага керек.",53:"Калкан безинин гормондорунун курамында.",80:"Уулуу, организмге зыяндуу.",82:"Уулуу, организмге зыяндуу.",92:"Радиоактивдүү, организмге зыяндуу."};
const bio=z=>BIO[z]||"Тирүү организмдерде негизги ролу жок же өтө аз.";

// электрон кабыктары (Маделунг эрежеси, бир нече өзгөчөлүк менен)
const SUB=[[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]];
const EXC={24:[2,8,13,1],29:[2,8,18,1],46:[2,8,18,18],47:[2,8,18,18,1],79:[2,8,18,32,18,1]};
function shells(z){
  if(EXC[z])return EXC[z];
  const r=[0,0,0,0,0,0,0,0];let left=z;
  for(const[n,l]of SUB){if(left<=0)break;const k=Math.min(2*(2*l+1),left);r[n]+=k;left-=k}
  return r.slice(1).filter(x=>x>0);
}

// ---------- 3D ----------
const $=id=>document.getElementById(id);
const canvas=$("stage");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0e1a24);
const camera=new THREE.PerspectiveCamera(50,1,0.1,100);
scene.add(new THREE.AmbientLight(0xffffff,.6));
const light=new THREE.PointLight(0xffffff,1.2);light.position.set(8,8,12);scene.add(light);
const gS=new THREE.SphereGeometry(1,12,12);
const mP=new THREE.MeshPhongMaterial({color:0xff6b6b}),mN=new THREE.MeshPhongMaterial({color:0xb8c4cf});
const mE=new THREE.MeshPhongMaterial({color:0x5cc8ff,emissive:0x1a5f80}),mV=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x7a4a00});
let atom=null,electrons=[],cur=0;

function build(i){
  cur=i;
  if(atom)scene.remove(atom);
  electrons=[];atom=new THREE.Group();
  const z=i+1,m=EL[i].m,n=m-z,R=0.2*Math.cbrt(m)+0.15,rs=Math.max(.12,.28-m/1100);
  for(let k=0;k<m;k++){
    const y=m===1?0:1-2*(k+.5)/m,rr=Math.sqrt(1-y*y),t=k*2.399963,d=R*Math.cbrt((k*0.618034)%1);
    const isP=Math.floor((k+1)*z/m)>Math.floor(k*z/m);
    const s=new THREE.Mesh(gS,isP?mP:mN);
    s.scale.setScalar(rs);
    s.position.set(Math.cos(t)*rr*d,y*d,Math.sin(t)*rr*d);
    atom.add(s);
  }
  const sh=shells(z);let maxR=0;
  sh.forEach((cnt,si)=>{
    const rad=R+1.7+si*1.0,g=new THREE.Group();maxR=rad;
    g.rotation.set(si*0.7+0.3,si*0.5,si*0.9);
    const pts=[];for(let a=0;a<=64;a++)pts.push(new THREE.Vector3(Math.cos(a/64*6.2832)*rad,Math.sin(a/64*6.2832)*rad,0));
    g.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x2f5d7a})));
    for(let k=0;k<cnt;k++){
      const e=new THREE.Mesh(gS,si===sh.length-1?mV:mE);e.scale.setScalar(.2);g.add(e);
      electrons.push({m:e,rad,ang:k/cnt*6.2832,sp:1.4/Math.sqrt(1+si)});
    }
    atom.add(g);
  });
  scene.add(atom);
  camera.position.z=Math.max(11,maxR*2.4);
  const c=CAT[cat(z)];
  $("big").textContent=EL[i].s;$("big").style.borderColor=c[1];$("big").style.color=c[1];
  $("nm").textContent=EL[i].n;
  $("z").textContent=z;$("a").textContent=m;$("pr").textContent=z;$("ne").textContent=n;$("el").textContent=z;
  $("sh").textContent=sh.join(", ");$("va").textContent=sh[sh.length-1];$("gr").textContent=c[0];
  $("bio").textContent="Биологияда: "+bio(z);
  [...$("pt").children].forEach((b,k)=>b.classList.toggle("on",k===i));
}

// ---------- Мезгилдик таблица ----------
function pos(z){return z==1?[1,1]:z==2?[1,18]:z<=4?[2,z-2]:z<=10?[2,z+8]:z<=12?[3,z-10]:z<=18?[3,z]:z<=36?[4,z-18]:z<=54?[5,z-36]:z<=56?[6,z-54]:z<=71?[9,z-54]:z<=86?[6,z-68]:z<=88?[7,z-86]:z<=103?[10,z-86]:[7,z-100]}
EL.forEach((e,i)=>{
  const b=document.createElement("button"),p=pos(i+1),c=CAT[cat(i+1)][1];
  b.style.gridRow=p[0];b.style.gridColumn=p[1];b.style.borderColor=c;
  b.innerHTML="<small>"+(i+1)+"</small><b style='color:"+c+"'>"+e.s+"</b>";
  b.title=e.n;b.onclick=()=>build(i);$("pt").appendChild(b);
});
$("pv").onclick=()=>build((cur+117)%118);
$("nx").onclick=()=>build((cur+1)%118);
$("rd").onclick=()=>build(Math.floor(Math.random()*118));
addEventListener("keydown",e=>{if($("sim").hidden)return;if(e.key==="ArrowRight")$("nx").click();if(e.key==="ArrowLeft")$("pv").click()});

// ---------- Буруу ----------
let drag=false,px=0,py=0,ry=0,rx=0;
canvas.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;canvas.style.cursor="grabbing"};
addEventListener("pointerup",()=>{drag=false;canvas.style.cursor="grab"});
addEventListener("pointermove",e=>{if(!drag)return;ry+=(e.clientX-px)*.008;rx+=(e.clientY-py)*.008;px=e.clientX;py=e.clientY});
canvas.addEventListener("wheel",e=>{e.preventDefault();camera.position.z=Math.min(60,Math.max(5,camera.position.z+e.deltaY*.02))},{passive:false});
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",resize);
const clock=new THREE.Clock();
function loop(){
  const dt=clock.getDelta(),s=+$("spd").value;
  electrons.forEach(o=>{o.ang+=dt*o.sp*s;o.m.position.set(Math.cos(o.ang)*o.rad,Math.sin(o.ang)*o.rad,0)});
  if(!drag)ry+=dt*.15*s;
  atom.rotation.set(rx,ry,0);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}

// ---------- Тест ----------
const POOL=[...Array(36).keys()].map(x=>x+1).concat([47,50,53,79,80,82,92]);
const BQ=[6,8,9,12,17,20,26,53,11];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const rp=a=>a[Math.floor(Math.random()*a.length)];
function opts(correct,from){
  const o=shuf([...new Set(from)].filter(v=>v!==correct)).slice(0,3);
  return shuf([correct,...o]).map(v=>({t:v,ok:v===correct}));
}
function mk(){
  const t=Math.floor(Math.random()*6);
  let z=rp(POOL),e=EL[z-1];
  if(t===0)return{z,q:e.s+" — бул кайсы элемент?",o:opts(e.n,POOL.map(k=>EL[k-1].n))};
  if(t===1)return{z,q:"«"+e.n+"» элементинин химиялык белгиси кайсы?",o:opts(e.s,POOL.map(k=>EL[k-1].s))};
  if(t===2){const c=[];for(let d=-5;d<=5;d++)if(d&&z+d>0)c.push(z+d);return{z,q:e.n+" атомунда канча протон бар?",o:opts(z,c)}}
  if(t===3)return{z,q:e.n+" кайсы топко кирет?",o:opts(CAT[cat(z)][0],CAT.map(c=>c[0]))};
  if(t===4){z=rp(BQ);e=EL[z-1];return{z,q:"Кайсы элемент: «"+BIO[z]+"»",o:opts(e.n,BQ.map(k=>EL[k-1].n))}}
  return{z,q:e.n+" атомунда канча электрон кабыгы бар?",o:opts(shells(z).length,[1,2,3,4,5,6,7])};
}
let Q=[],qi=0,score=0,bad=[];
function start(){Q=Array.from({length:10},mk);qi=0;score=0;bad=[];show()}
function show(){
  const box=$("qb");
  if(qi>=Q.length){
    const msg=score>=9?"Мыкты! Сиз элементтерди абдан жакшы билесиз.":score>=6?"Жакшы! Дагы бир аз кайталасаңыз болот.":"Симуляция бөлүмүндөгү элементтерди кайра карап чыгыңыз.";
    box.innerHTML="<h2>Жыйынтык: "+score+" / "+Q.length+"</h2><p>"+msg+"</p>"+(bad.length?"<p class='muted'>Ката кеткен элементтер: "+[...new Set(bad)].map(z=>EL[z-1].s+" ("+EL[z-1].n+")").join(", ")+"</p>":"")+"<button class='btn' id='rs'>Кайра баштоо</button>";
    $("rs").onclick=start;return;
  }
  const q=Q[qi];
  box.innerHTML="<div class='muted'>Суроо "+(qi+1)+" / "+Q.length+" · Упай: "+score+"</div><h2>"+q.q+"</h2><div id='ol'></div><div id='ex'></div>";
  q.o.forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o.t;
    b.onclick=()=>{
      const all=[...$("ol").children];
      all.forEach((x,k)=>{x.disabled=true;if(q.o[k].ok)x.classList.add("ok")});
      if(o.ok)score++;else{b.classList.add("bad");bad.push(q.z)}
      const e=EL[q.z-1];
      $("ex").innerHTML="<div class='exp'><b>"+(o.ok?"Туура!":"Ката.")+"</b> "+e.s+" — "+e.n+": "+q.z+" протон, "+(e.m-q.z)+" нейтрон, "+q.z+" электрон. "+bio(q.z)+"</div><button class='btn' id='nq'>"+(qi===Q.length-1?"Жыйынтык":"Кийинки суроо")+"</button>";
      $("nq").onclick=()=>{qi++;show()};
    };
    $("ol").appendChild(b);
  });
}

// ---------- Табулар ----------
function tab(n){
  $("sim").hidden=n!==1;$("quiz").hidden=n!==2;
  $("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);
  if(n===1)resize();
}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
build(25);resize();loop();start();
</script>
